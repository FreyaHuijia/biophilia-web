<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Team Members | Biophilia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=Public+Sans:wght@300;400;500&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles.css">
</head>

<body class="content-page">

  <header class="site-header">
    <a class="site-logo" href="./">BIOPHILIA</a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="./">Home</a>
      <a href="about.html">About</a>
      <a href="team.html" aria-current="page">Team Members</a>
      <a href="contact.html" data-contact-open>Contact</a>
    </nav>
  </header>

  <main class="page-main">
    <div class="eyebrow">About the Team</div>
    <h1 class="page-title">The People Behind the Exhibit</h1>
  </main>

  <!-- ============ CONTACT POP-UP SHELL ============ -->
  <div class="contact-modal" id="contactModal" hidden>
    <div
      class="contact-modal__backdrop"
      data-contact-close
      aria-hidden="true"
    ></div>

    <div
      class="contact-modal__dialog"
      role="dialog"
      aria-modal="true"
      aria-label="Contact Biophilia"
    >
      <button
        class="contact-modal__close"
        type="button"
        data-contact-close
        aria-label="Close contact form"
      >
        ×
      </button>

      <iframe
        class="contact-modal__frame"
        id="contactFrame"
        title="Contact Biophilia"
        loading="lazy"
      ></iframe>
    </div>
  </div>

  <script src="contact-modal.js"></script>

</body>
</html>
