<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Biophilia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Public+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
 
<body class="contact-page">

<main class="contact-content">
  <div class="eyebrow">Get in touch</div>
  <h1>Contact Biophilia</h1>

  <p class="contact-intro">
    For questions about the exhibition, artwork, or project, send us a
    message below.
  </p>

  <form
    class="contact-form"
    id="contactForm"
    action="https://formspree.io/f/xaewlpyr"
    method="POST"
  >
    <div class="contact-form__field">
      <label for="contactName">Name</label>
      <input
        id="contactName"
        name="name"
        type="text"
        autocomplete="name"
        required
      >
    </div>

    <div class="contact-form__field">
      <label for="contactEmail">Email</label>
      <input
        id="contactEmail"
        name="email"
        type="email"
        autocomplete="email"
        required
      >
    </div>

    <div class="contact-form__field">
      <label for="contactSubject">Subject</label>
      <input
        id="contactSubject"
        name="subject"
        type="text"
      >
    </div>

    <div class="contact-form__field">
      <label for="contactMessage">Message</label>
      <textarea
        id="contactMessage"
        name="message"
        rows="6"
        required
      ></textarea>
    </div>

    <input
      type="hidden"
      name="_subject"
      value="New message from the Biophilia website"
    >

    <button class="btn contact-form__submit" type="submit">
      Send message
    </button>

    <p
      class="contact-form__status"
      id="contactStatus"
      role="status"
      aria-live="polite"
    ></p>
  </form>
</main>

<script>
  const form = document.getElementById("contactForm");
  const status = document.getElementById("contactStatus");
  const submitButton = form.querySelector('button[type="submit"]');

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    submitButton.disabled = true;
    submitButton.textContent = "Sending...";
    status.className = "contact-form__status";
    status.textContent = "";

    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("Submission failed");
      }

      form.reset();
      submitButton.textContent = "Message sent";
      status.classList.add("is-success");
      status.textContent =
        "Thank you. Your message has been sent successfully.";
    } catch (error) {
      submitButton.textContent = "Send message";
      status.classList.add("is-error");
      status.textContent =
        "The message could not be sent. Please try again.";
    } finally {
      submitButton.disabled = false;
    }
  });
</script>

</body>
</html>
